name: android

on:
  push:
    branches: [feat/android-recorder, main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'   # AGP 9.1 needs JDK 17+; the app compiles for Java 17
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6   # same as the owner's laptop
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - run: flutter build apk --profile --target-platform android-arm64
      # The JVM tests of the copied BrainBit plugin (its calls off the main thread, packages/neurosdk2/VENDORED.md);
      # the build above wrote android/gradlew.
      - run: ./gradlew :neurosdk2:testDebugUnitTest
        working-directory: app/android
      # The app's own JVM tests (src/test: the Wi-Fi lock's holders and the night's Wi-Fi words, DECISIONS 612).
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: app/android
      - uses: actions/upload-artifact@v7
        with:
          name: eeg_tracker-recorder-apk
          path: app/build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
