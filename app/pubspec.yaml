name: eeg_tracker
description: "EEG Tracker: records a BrainBit headband all night on Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # BrainBit's own plugin; its core is a closed binary (DECISIONS row 3). Version 1.0.21 (the research note read it),
  # copied into packages/neurosdk2 (MIT) so its calls run off Android's main thread: packages/neurosdk2/VENDORED.md,
  # DECISIONS rows 410-413.
  neurosdk2:
    path: packages/neurosdk2
  # The labels shared with utof_tracker (DECISIONS 868): the vocabulary, estimates and answers, the queue and the
  # Yes / No / Not sure card. Our own package in this repo; pure Dart and Flutter widgets.
  shared_labels:
    path: ../packages/shared_labels
  # Foreground service whose TaskHandler isolate owns the whole BrainBit session (DECISIONS row 2).
  flutter_foreground_task: ^11.0.3
  permission_handler: ^13.0.2
  # Sound engine for the meditation feedback (DECISIONS rows 11 and 72): SoLoud + miniaudio, MIT/zlib. Its build
  # hook compiles the C++ engine with the NDK; the Xiph decoders are left out (below), we only play WAV and
  # waveforms made in memory.
  flutter_soloud: ^5.3.0
  # ONNX Runtime 1.28 for the sleep model (AnySleep, assets/models; DECISIONS row 95). MIT. Pinned: the export
  # script checks the models with the same ONNX Runtime version (analysis/pyproject.toml, group "onnx").
  flutter_onnxruntime: 1.9.0
  crypto: ^3.0.6
  # The dream catcher's microphone (DECISIONS row 112): your spoken answers and your own prompts as WAV files.
  # BSD-3-Clause, by llfbandit; on Android it uses the system's AudioRecord, nothing bundled.
  record: ^7.2.0
  qr: ^4.0.1
  # Bluetooth LE for our own BrainBit connection (lib/headband/own/, behind a switch; DECISIONS rows 210-211).
  # BSD-3-Clause, by Navideck. Pinned: lib/headband/own/universal_transport.dart names the version in the night's
  # log. Its Linux part pulls `bluez` and `dbus` (MPL-2.0); neither is compiled into the Android app.
  universal_ble: 3.3.0
  # The dream catcher's speech to text (DECISIONS row 250): k2-fsa's sherpa-onnx, Apache-2.0, prebuilt for arm64 and
  # x86_64; its own ONNX Runtime 1.28.2 library has the file name of flutter_onnxruntime's 1.28.0, so
  # android/build.gradle.kts packages sherpa's copy as libsherpa-ortx.so and both load side by side.
  # Pinned: scripts/dream_text_check.py checks the same version on the laptop.
  sherpa_onnx: 2.0.1
  # The app's own log (lib/logs/, DECISIONS 710): the Dart team's levelled, named loggers (BSD-3-Clause). Already in
  # the app through flutter_soloud, whose warnings land in the same log; nothing new is compiled in.
  logging: ^1.3.0
  # The log page's Share: Android's share sheet with the log files attached (BSD-3-Clause, Flutter Community; its own
  # FileProvider). DECISIONS 712.
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # A fake clock for the reconnect ladder's tests (test/reconnect_ladder_test.dart); already in the lock through
  # flutter_test.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # The "i" notes: assets/evidence links to ../docs/evidence (one source for the pages and the app).
  assets:
    - assets/evidence/
    # AnySleep's three runs as ONNX (scripts/export_anysleep_onnx.py) and its MIT licence, which must travel with
    # the weights. Listed one by one so the folder's README stays out of the APK.
    - assets/models/anysleep-run1.onnx
    - assets/models/anysleep-run2.onnx
    - assets/models/anysleep-run3.onnx
    - assets/models/LICENSE-AnySleep.txt
    # Silero's voice detector for the dream catcher's speech to text (0.6 MB, MIT); the speech model itself is a
    # download (lib/dream/speech_model.dart).
    - assets/models/silero_vad.onnx
    - assets/models/LICENSE-silero-vad.txt

hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true # no Opus/Ogg/Vorbis/FLAC: nothing to download, smaller APK
