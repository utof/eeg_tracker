include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    # BrainBit's plugin, copied as it came (packages/neurosdk2/VENDORED.md); not our code to lint.
    - packages/**

linter:
  rules:
    - unawaited_futures
    - always_declare_return_types
    - prefer_final_locals
    - avoid_dynamic_calls
